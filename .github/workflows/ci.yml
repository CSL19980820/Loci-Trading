# CI：pytest + import-linter + 前端 typecheck/test；可选 e2e。
# 不读写仓库真实 data/*.db（pytest 经 tests/conftest.py 隔离临时目录）。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pytest + lint-imports)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pytest
        run: python -m pytest tests/ -q --tb=line

      - name: Import linter
        run: lint-imports

  # Baseline and report-only jobs are isolated from the existing gates so each
  # add-on can be disabled or reverted without changing runtime dependencies.
  performance-baseline:
    name: Python performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCI_BASELINE_ARTIFACT: ${{ github.workspace }}/artifacts/performance-baseline.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run explicit baseline
        run: |
          mkdir -p artifacts
          python -m pytest -q tests/benchmarks/baseline_benchmark.py --tb=line

      - name: Upload performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-${{ github.run_id }}
          path: artifacts/performance-baseline.json
          if-no-files-found: warn
          retention-days: 14

  python-quality:
    name: Python ruff (F 类硬门禁 + 全量报告)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: python -m pip install --disable-pip-version-check ruff==0.9.10

      # 硬门禁：F 类是真错——未使用/重复导入、未定义名、被遮蔽的导入、写了没用的
      # 局部变量。存量已清零，再涨回来就是新引入的，必须当场拦住。
      # 风格类还有上千条噪声，那部分留在下一步 report-only，不阻断。
      - name: Ruff F gate
        run: ruff check --select F src cli tests --output-format concise

      - name: Ruff full report-only
        continue-on-error: true
        run: |
          set +e
          mkdir -p artifacts
          ruff check src tests cli --output-format json > artifacts/ruff.json
          status=$?
          set -e
          if [ ! -s artifacts/ruff.json ]; then
            printf '{"tool":"ruff","status":"no-output","exit_code":%s}\n' "$status" > artifacts/ruff.json
          fi
          printf '{"tool":"ruff","report_only":true,"exit_code":%s}\n' "$status" > artifacts/ruff-status.json
          # 报告写进 job summary：artifact 没人点开，摘要在 PR 页面上直接能看到。
          {
            echo "### Ruff 全量报告（report-only）"
            echo
            echo "exit code: \`$status\`。F 类已由上一步硬门禁保证为 0，这里剩的是风格类。"
            echo
            echo '```'
            ruff check src tests cli --statistics || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14


  uv-validation:
    name: uv isolated install validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.15'
          enable-cache: false

      - name: Resolve and install in runner temp
        env:
          UV_BASELINE_ENV: ${{ runner.temp }}/loci-uv-venv
          UV_BASELINE_LOCK: ${{ runner.temp }}/loci-requirements.lock
        run: |
          set -euo pipefail
          mkdir -p artifacts
          uv pip compile requirements-dev.txt \
            --python 3.12 \
            --generate-hashes \
            --output-file "$UV_BASELINE_LOCK"
          uv venv --python 3.12 "$UV_BASELINE_ENV"
          uv pip sync \
            --python "$UV_BASELINE_ENV/bin/python" \
            "$UV_BASELINE_LOCK"
          uv pip freeze --python "$UV_BASELINE_ENV/bin/python" > artifacts/uv-freeze.txt
          cp "$UV_BASELINE_LOCK" artifacts/requirements-uv.lock
          "$UV_BASELINE_ENV/bin/python" -c \
            "import numpy, pandas; print(numpy.__version__, pandas.__version__)"

      - name: Upload uv validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uv-validation-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  security-reports:
    name: Security (密钥扫描硬门禁 + 依赖/工作流报告)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install report tools
        run: |
          python -m pip install --disable-pip-version-check \
            pip-audit==2.9.0 \
            zizmor==1.26.1

      - name: Dependency audit and SBOM (report-only)
        continue-on-error: true
        env:
          PYTHONUTF8: '1'
        run: |
          set +e
          mkdir -p artifacts
          pip-audit -r requirements-dev.txt \
            --format json \
            --output artifacts/pip-audit.json
          audit_status=$?
          pip-audit -r requirements-dev.txt \
            --format cyclonedx-json \
            --output artifacts/python-sbom.cdx.json
          sbom_status=$?
          set -e
          if [ ! -s artifacts/pip-audit.json ]; then
            printf '{"tool":"pip-audit","status":"no-output","exit_code":%s}\n' "$audit_status" > artifacts/pip-audit.json
          fi
          if [ ! -s artifacts/python-sbom.cdx.json ]; then
            printf '{"tool":"pip-audit","format":"cyclonedx-json","status":"no-output","exit_code":%s}\n' "$sbom_status" > artifacts/python-sbom.cdx.json
          fi
          printf '{"tool":"pip-audit","report_only":true,"exit_code":%s,"sbom_exit_code":%s}\n' \
            "$audit_status" "$sbom_status" > artifacts/pip-audit-status.json
          # 报告只上传 artifact 等于没人读；结论直接摊在 job summary 上。
          # 用 python 而不是 jq 渲染：这一步本来就装了 python，少一个环境假设。
          set +e
          python - "$audit_status" "$sbom_status" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          audit, sbom = sys.argv[1], sys.argv[2]
          with open("artifacts/pip-audit.json", encoding="utf-8") as fh:
            report = json.load(fh)
          deps = report.get("dependencies") or []
          bad = [item for item in deps if item.get("vulns")]
          rows = [
            "| {} | {} | {} |".format(
              item.get("name"),
              item.get("version"),
              ", ".join(str(vuln.get("id")) for vuln in item["vulns"]),
            )
            for item in bad
          ]
          print("### pip-audit（report-only）")
          print()
          print("exit code: `{}`；SBOM exit code: `{}`".format(audit, sbom))
          print()
          print("| 包 | 版本 | 漏洞 |")
          print("|---|---|---|")
          print("\n".join(rows) if rows else "| （无已知漏洞） | | |")
          print()
          print("扫描依赖数：{}".format(len(deps)))
          PY
          exit 0

      - name: GitHub Actions scan (report-only)
        continue-on-error: true
        run: |
          set +e
          mkdir -p artifacts
          zizmor --format=json .github/workflows > artifacts/zizmor.json
          status=$?
          set -e
          if [ ! -s artifacts/zizmor.json ]; then
            printf '{"tool":"zizmor","status":"no-output","exit_code":%s}\n' "$status" > artifacts/zizmor.json
          fi
          printf '{"tool":"zizmor","report_only":true,"exit_code":%s}\n' "$status" > artifacts/zizmor-status.json
          {
            echo "### zizmor 工作流审计（report-only）"
            echo
            echo "exit code: \`$status\`"
            echo
            echo '```'
            zizmor --format=plain .github/workflows 2>&1 | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # 硬门禁：密钥进仓是不可逆事故——一旦推上去就必须当作已泄漏去轮换。
      # 已知假阳性登记在仓库根的 .gitleaks.toml（按假凭据字面量放行，不是路径豁免），
      # 所以这里没有 continue-on-error，也没有末尾 exit 0。
      # 放在本 job 最后一步：前面两步的报告仍会写进 summary 与 artifact。
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          mkdir -p artifacts
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive="$RUNNER_TEMP/$asset"
          checksums="$RUNNER_TEMP/gitleaks_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL "$base/$asset" -o "$archive"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$checksums"
          expected="$(awk -v file="$asset" '$2 == file {print $1}' "$checksums")"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect \
            --source . \
            --no-git \
            --redact \
            --config .gitleaks.toml \
            --report-format json \
            --report-path "$GITHUB_WORKSPACE/artifacts/gitleaks.json" \
            --exit-code 1

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14


  frontend:
    name: Frontend (typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: E2E
        run: bun run test:e2e
