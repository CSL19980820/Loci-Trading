<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c41e3a" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>Loci</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #eef2f6;
        color: #142033;
        font-family: 'IBM Plex Sans', 'Noto Sans SC', system-ui, sans-serif;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 55% 40% at 50% 38%, rgba(196, 30, 58, 0.05), transparent 70%),
          #eef2f6;
        transition: opacity 0.32s ease;
      }
      #boot-splash.is-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.95rem;
        width: min(14rem, 72vw);
        animation: boot-rise 0.42s ease-out both;
      }
      #boot-splash .mark {
        position: relative;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 0.4rem;
        background: #c41e3a;
        color: #fff;
        display: grid;
        place-items: center;
        font-family: 'Fraunces', 'Noto Serif SC', serif;
        font-weight: 700;
        letter-spacing: 0.03em;
        font-size: 0.95rem;
        box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.12);
        animation: boot-seal 0.5s ease-out both;
      }
      #boot-splash .mark::after {
        content: '';
        position: absolute;
        inset: 0.28rem;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 0.22rem;
        pointer-events: none;
      }
      #boot-splash .brand-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7rem;
        width: 100%;
      }
      #boot-splash .brand {
        font-family: 'Fraunces', 'Noto Serif SC', serif;
        font-size: 1.45rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #142033;
        line-height: 1;
      }
      #boot-splash .tape {
        position: relative;
        width: 100%;
        height: 1px;
        background: #d5dce6;
        overflow: hidden;
      }
      #boot-splash .tape-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: #c41e3a;
        animation: boot-tape 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.18s forwards;
      }
      #boot-splash .status {
        display: flex;
        align-items: baseline;
        gap: 0.45rem;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        color: #5b6b7c;
        animation: boot-fade 0.45s ease 0.28s both;
      }
      #boot-splash .status-kicker {
        color: #8a96a5;
      }
      #boot-splash .status-dot {
        color: #c5ced9;
      }
      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes boot-seal {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes boot-tape {
        from {
          width: 0;
        }
        to {
          width: 72%;
        }
      }
      @keyframes boot-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .stage,
        #boot-splash .mark,
        #boot-splash .status {
          animation: none;
        }
        #boot-splash .tape-fill {
          animation: none;
          width: 72%;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-busy="true" aria-live="polite">
      <div class="stage">
        <div class="mark" aria-hidden="true">LC</div>
        <div class="brand-block">
          <div class="brand">Loci</div>
          <div class="tape" aria-hidden="true"><div class="tape-fill"></div></div>
        </div>
        <div class="status">
          <span class="status-kicker">开账</span>
          <span class="status-dot" aria-hidden="true">·</span>
          <span>启动中</span>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
