<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c41e3a" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>Loci</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6f3ee;
        color: #1c1917;
        font-family: 'IBM Plex Sans', 'Noto Sans SC', system-ui, sans-serif;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #f6f3ee;
        transition: opacity 0.25s ease;
      }
      #boot-splash.is-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .mark {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 0.35rem;
        background: #c41e3a;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        letter-spacing: 0.04em;
        font-size: 0.95rem;
      }
      #boot-splash .spin {
        width: 1.4rem;
        height: 1.4rem;
        border: 2px solid #e7e0d6;
        border-top-color: #c41e3a;
        border-radius: 50%;
        animation: boot-rot 0.75s linear infinite;
      }
      #boot-splash .hint {
        font-size: 0.82rem;
        color: #78716c;
        letter-spacing: 0.06em;
      }
      @keyframes boot-rot {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .spin {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-busy="true" aria-live="polite">
      <div class="mark" aria-hidden="true">LC</div>
      <div class="spin" aria-hidden="true"></div>
      <div class="hint">Loci 启动中</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
