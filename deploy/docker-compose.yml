name: qianlong-palace

services:
  palace:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # 服务器的出网代理只监听在宿主机回环地址；构建阶段通过 host
      # 网络和标准 proxy build args 使用它，值不会进入最终镜像或运行容器。
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    restart: unless-stopped
    user: "10001:10001"
    environment:
      PALACE_ENV: production
      PALACE_ALLOWED_HOSTS: ${PALACE_ALLOWED_HOSTS:?请在 /srv/qianlong-palace/.env 设置 PALACE_ALLOWED_HOSTS}
      PALACE_WRITE_TOKEN: ${PALACE_WRITE_TOKEN:?请在 /srv/qianlong-palace/.env 设置 PALACE_WRITE_TOKEN}
      PALACE_AUTH_USERNAME: ${PALACE_AUTH_USERNAME:?请在 /srv/qianlong-palace/.env 设置 PALACE_AUTH_USERNAME}
      PALACE_AUTH_PASSWORD: ${PALACE_AUTH_PASSWORD:?请在 /srv/qianlong-palace/.env 设置 PALACE_AUTH_PASSWORD}
      PALACE_SESSION_SECRET: ${PALACE_SESSION_SECRET:?请在 /srv/qianlong-palace/.env 设置 PALACE_SESSION_SECRET}
      # 可选，默认空=会话 Cookie 带 Secure。仅 HTTP 临时排障模式才置 1。
      PALACE_INSECURE_HTTP: ${PALACE_INSECURE_HTTP:-}
      PALACE_DB: /data/qianlong.db
      PALACE_STATIC_DIR: /app/frontend/dist
      # 行情仓、运维库、技能包全部落在数据卷上。技能包尤其关键：
      # 默认位置在代码目录里，而每次发布都会换成新的 release 目录，
      # 装好的技能包会随下一次同步凭空消失且没有任何报错。
      PALACE_MARKET_DB: /data/market.db
      PALACE_OPS_DB: /data/ops.db
      PALACE_SKILL_ROOT: /data/skills
      # 定时任务默认不开。容器是唯一该跑调度的地方，本地跑脚本不该顺手
      # 把 cron 也起来。设为 1 才启用。
      PALACE_ENABLE_SCHEDULER: ${PALACE_ENABLE_SCHEDULER:-1}
      # cron 按容器时区解释。不设的话容器是 UTC，"15:35 盘后同步"
      # 会在北京时间 23:35 触发。
      TZ: ${TZ:-Asia/Shanghai}
      # LLM API Key 的加密主密钥。compose 用的是显式白名单，
      # 只写进 .env 而不在这里列出，容器是读不到的。
      PALACE_AI_MASTER_KEY: ${PALACE_AI_MASTER_KEY:-}
    ports:
      - "127.0.0.1:18787:8787"
    volumes:
      - /srv/qianlong-palace/data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 服务器共 3.7G 内存、仅剩约 1.1G 可用。装上 pandas/numpy/akshare 后，
    # 一次全市场面板加载 + 回测很容易吃掉几百 MB；不设上限的话 OOM 会先
    # 打死宿主上的其他服务，而不是让本容器自己重启。
    deploy:
      resources:
        limits:
          memory: 1400M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os; from urllib.request import Request, urlopen; host=os.environ['PALACE_ALLOWED_HOSTS'].split(',')[0].strip(); urlopen(Request('http://127.0.0.1:8787/api/health', headers={'Host': host}), timeout=3)"
      # 间隔从 30s 收到 10s：发布脚本要靠 healthy 才切换 current，
      # 30s 一次意味着最快也要半分钟才能确认新版本可用。
      interval: 10s
      timeout: 5s
      retries: 3
      # 启动宽限从 20s 放到 45s：import pandas/akshare 就要好几秒。
      start_period: 45s
